name: Build K2P ALAMEER Firmware

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Padavan source repository (must support K2P)"
        required: false
        default: "https://github.com/hanwckf/rt-n56u.git"
      source_branch:
        description: "Branch"
        required: false
        default: "master"

env:
  TARGET: K2P

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout this repository (patches)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            kmod cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Clone Padavan source
        run: |
          SRC="${{ github.event.inputs.source_repo }}"
          BR="${{ github.event.inputs.source_branch }}"
          SRC="${SRC:-https://github.com/hanwckf/rt-n56u.git}"
          BR="${BR:-master}"
          git clone --depth=1 -b "$BR" "$SRC" rt-n56u

      - name: Apply ALAMEER custom patches
        run: |
          chmod +x custom_patches/apply.sh
          ./custom_patches/apply.sh "$GITHUB_WORKSPACE/rt-n56u/trunk" "$GITHUB_WORKSPACE/custom_patches"

      - name: Fetch prebuilt toolchain
        working-directory: rt-n56u/toolchain-mipsel
        run: |
          if [ -x ./dl_toolchain.sh ]; then
            ./dl_toolchain.sh
          else
            echo "No dl_toolchain.sh found, building toolchain from source (slow)..."
            ./build_toolchain.sh
          fi

      - name: Build firmware (make K2P)
        working-directory: rt-n56u/trunk
        run: |
          if [ -x ./clear_tree ]; then sudo ./clear_tree || true; elif [ -x ./clean_sources ]; then sudo ./clean_sources || true; fi
          sudo ./build_firmware_modify ${TARGET}
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Collect firmware files
        run: |
          mkdir -p out
          find rt-n56u/trunk/images -type f \( -name '*.trx' -o -name '*.bin' \) -exec cp -v {} out/ \;
          ls -lh out/
          test -n "$(ls -A out)" || { echo "No firmware produced"; exit 1; }

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: K2P_ALAMEER_Firmware
          path: out/*
          if-no-files-found: error
